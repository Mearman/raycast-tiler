name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancels a superseded run when a branch or pull request is pushed to again. Not on main: a run that is already releasing must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint the commits in the range
        # release.config.ts owns the allowed commit types, so the repository's own commitlint config is used rather than a bundled one.
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          else
            pnpm exec commitlint --last
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker compares the stored result with the current source by content, so a cache from an unrelated run is always safe: a mismatch only means more mutants rerun.
      - name: Restore Stryker incremental result cache
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      # On main the whole run is forced, because Stryker's differ only sees mutated and test files and cannot see a change elsewhere that alters behaviour.
      - run: pnpm mutation${{ github.ref == 'refs/heads/main' && ' -- --force' || '' }}
      - name: Save Stryker incremental result cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

  required-checks:
    name: Required Checks
    needs: [commitlint, lint, typecheck, mutation]
    # Always runs, even when a dependency failed, so it reports that failure instead of being skipped. A required check that is silently absent blocks a pull request without saying why.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  release:
    name: Release
    needs: [commitlint, lint, typecheck, mutation]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push the release commit and tag and create the GitHub Release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
    outputs:
      published: ${{ steps.before.outputs.version != steps.after.outputs.version }}
      version: ${{ steps.after.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release analyses the full commit history since the last release.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read pre-release version
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release
        # HUSKY=0 so no commit hook runs against the automated release commit.
        run: HUSKY=0 pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read post-release version
        id: after
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Publishes the package to GitHub Packages under a scoped alias. GitHub Packages requires the npm name to be scoped to the repository owner, and the extension's own name is the Raycast manifest name. Rewriting the fields at publish time keeps the alias from drifting from the real package.json.
  publish-github-packages:
    name: Publish alias to GitHub Packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the release commit semantic-release just pushed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          # Explicit, because the package name is rewritten after this step and setup-node would otherwise infer the scope from the unscoped name.
          scope: "@mearman"
      - run: pnpm install --frozen-lockfile
      - name: Rewrite the package name and registry for GitHub Packages
        run: |
          npm pkg set name="@mearman/raycast-tiler"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
      - run: npm publish --access public
        env:
          # GitHub Packages has no OIDC exchange, so the job authenticates with the workflow token.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
